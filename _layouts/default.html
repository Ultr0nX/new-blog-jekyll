    <script>
    // Lightweight Theme Toggle - Applied to body element
    (function() {
        const body = document.body;
        const themeToggle = document.getElementById('theme-toggle');
        const moonIcon = '<i class="fas fa-moon"></i>';
        const sunIcon = '<i class="fas fa-sun"></i>';
        const STORAGE_KEY = 'theme-preference';
        const LIGHT_THEME = 'light-theme';
        const DARK_THEME = 'dark-theme';

        // Initialize theme from localStorage or system preference
        function initTheme() {
            const saved = localStorage.getItem(STORAGE_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? DARK_THEME : LIGHT_THEME);
            
            applyTheme(theme);
        }

        // Apply theme to body and update button
        function applyTheme(theme) {
            body.classList.remove(LIGHT_THEME, DARK_THEME);
            body.classList.add(theme);
            
            const isLight = theme === LIGHT_THEME;
            themeToggle.innerHTML = isLight ? sunIcon : moonIcon;
            themeToggle.setAttribute('title', isLight ? 'Switch to dark mode' : 'Switch to light mode');
            localStorage.setItem(STORAGE_KEY, theme);
        }

        // Toggle theme on button click
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.classList.contains(LIGHT_THEME) ? LIGHT_THEME : DARK_THEME;
            const newTheme = currentTheme === LIGHT_THEME ? DARK_THEME : LIGHT_THEME;
            applyTheme(newTheme);
        });

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTheme);
        } else {
            initTheme();
        }

        // Respond to system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(STORAGE_KEY)) {
                applyTheme(e.matches ? DARK_THEME : LIGHT_THEME);
            }
        });
    })();

    // Typewriter effect
    document.addEventListener("DOMContentLoaded", function() {
        const text = "> _ Welcome! This is Sunil Kumar (0xc1ph3r / Ultron)";
        const typewriter = document.getElementById("typewriter");
        if (typewriter) {
            typewriter.textContent = text;
        }
    });
    </script>
